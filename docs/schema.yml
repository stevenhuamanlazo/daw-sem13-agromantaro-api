      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este resena.
        required: true
      tags:
      - resenas
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/sesion/:
    get:
      operationId: sesion_retrieve
      description: Sesión por cookie para SPAs (el resto de métodos exige CSRF vía
        SessionAuthentication).
      summary: Estado de la sesión
      tags:
      - sesion
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoSesion'
          description: ''
    post:
      operationId: sesion_create
      description: Sesión por cookie para SPAs (el resto de métodos exige CSRF vía
        SessionAuthentication).
      summary: Iniciar sesión
      tags:
      - sesion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredencialesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredencialesRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Sesión iniciada
        '400':
          description: Credenciales inválidas
    delete:
      operationId: sesion_destroy
      description: Sesión por cookie para SPAs (el resto de métodos exige CSRF vía
        SessionAuthentication).
      summary: Cerrar sesión
      tags:
      - sesion
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
components:
  schemas:
    Categoria:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        nombre:
          type: string
          maxLength: 80
        padre:
          type: string
          format: uri
          nullable: true
        hijos:
          type: array
          items:
            type: string
            format: uri
          readOnly: true
        _links:
          type: object
          additionalProperties: {}
          readOnly: true
          title: ' links'
      required:
      - _links
      - hijos
      - id
      - nombre
      - slug
      - url
    CategoriaRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        padre:
          type: string
          format: uri
          nullable: true
      required:
      - nombre
    CertificacionEnum:
      enum:
      - ninguna
      - org_senasa
      - pgs
      - comercio_justo
      type: string
      description: |-
        * `ninguna` - Sin certificación
        * `org_senasa` - Orgánico SENASA
        * `pgs` - Sistema Participativo de Garantía
        * `comercio_justo` - Comercio Justo
    CredencialesRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    EstadoSesion:
      type: object
      properties:
        autenticado:
          type: boolean
        usuario:
          type: string
          nullable: true
      required:
      - autenticado
      - usuario
    ItemPedido:
      type: object
      properties:
        producto:
          type: string
          format: uri
        producto_nombre:
          type: string
          readOnly: true
        cantidad:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - cantidad
      - precio_unitario
      - producto
      - producto_nombre
      - subtotal
    ItemPedidoRequest:
      type: object
      properties:
        producto:
          type: string
          format: uri
        cantidad:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
      required:
      - cantidad
      - producto
    PaginatedPedidoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 41
        total_paginas:
          type: integer
          example: 5
        pagina_actual:
          type: integer
          example: 1
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
    PaginatedProductoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 41
        total_paginas:
          type: integer
          example: 5
        pagina_actual:
          type: integer
          example: 1
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Producto'
    PaginatedProductorList:
