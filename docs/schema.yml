openapi: 3.0.3
info:
  title: AgroMantaro Market API
  version: 1.0.0
  description: 'Marketplace agroecológico del Valle del Mantaro: productores, catálogo
    por lotes, pedidos con cupones y reseñas verificadas.'
paths:
  /api/categorias/:
    get:
      operationId: categorias_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - categorias
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
          description: ''
    post:
      operationId: categorias_create
      tags:
      - categorias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
  /api/categorias/{slug}/:
    get:
      operationId: categorias_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - categorias
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
    put:
      operationId: categorias_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - categorias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
    patch:
      operationId: categorias_partial_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - categorias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoriaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoriaRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
    delete:
      operationId: categorias_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - categorias
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/csrf/:
    get:
      operationId: csrf_retrieve
      description: Entrega el token CSRF y garantiza que la cookie 'csrftoken' esté
        presente.
      summary: Obtener token CSRF
      tags:
      - csrf
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/pedidos/:
    get:
      operationId: pedidos_list
      description: Pedidos del cliente autenticado (el personal ve todos).
      parameters:
      - in: query
        name: ciudad
        schema:
          type: string
      - in: query
        name: con_cupon
        schema:
          type: boolean
      - in: query
        name: desde
        schema:
          type: string
          format: date
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - cancelado
          - entregado
          - enviado
          - pagado
          - pendiente
        description: |-
          * `pendiente` - Pendiente de pago
          * `pagado` - Pagado
          * `enviado` - Enviado
          * `entregado` - Entregado
          * `cancelado` - Cancelado
      - in: query
        name: hasta
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: total_min
        schema:
          type: number
      tags:
      - pedidos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPedidoList'
          description: ''
    post:
      operationId: pedidos_create
      description: Pedidos del cliente autenticado (el personal ve todos).
      tags:
      - pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PedidoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PedidoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/pedidos/{id}/:
    get:
      operationId: pedidos_retrieve
      description: Pedidos del cliente autenticado (el personal ve todos).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este pedido.
        required: true
      tags:
      - pedidos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/pedidos/{id}/avanzar/:
    post:
      operationId: pedidos_avanzar_create
      description: (Staff) pagado → enviado → entregado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este pedido.
        required: true
      tags:
      - pedidos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
        '409':
          description: Estado inválido
  /api/pedidos/{id}/cancelar/:
    post:
      operationId: pedidos_cancelar_create
      description: Cancela un pedido pendiente/pagado y devuelve el stock reservado.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este pedido.
        required: true
      tags:
      - pedidos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
        '409':
          description: Estado inválido
  /api/pedidos/{id}/pagar/:
    post:
      operationId: pedidos_pagar_create
      description: Registra el pago (simulado) de un pedido pendiente.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este pedido.
        required: true
      tags:
      - pedidos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
        '409':
          description: Estado inválido
  /api/pedidos/validar-cupon/:
    post:
      operationId: pedidos_validar_cupon_create
      description: Previsualiza el descuento de un cupón sin crear el pedido.
      tags:
      - pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidarCuponRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidarCuponRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidarCuponRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Descuento calculado
  /api/productores/:
    get:
      operationId: productores_list
      description: Productores registrados. Lectura pública; alta/edición solo personal
        administrativo.
      parameters:
      - in: query
        name: certificacion
        schema:
          type: string
          enum:
          - comercio_justo
          - ninguna
          - org_senasa
          - pgs
        description: |-
          * `ninguna` - Sin certificación
          * `org_senasa` - Orgánico SENASA
          * `pgs` - Sistema Participativo de Garantía
          * `comercio_justo` - Comercio Justo
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
          enum:
          - ayacucho
          - huancavelica
          - junin
          - pasco
        description: |-
          * `junin` - Junín
          * `huancavelica` - Huancavelica
          * `pasco` - Pasco
          * `ayacucho` - Ayacucho
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - productores
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductorList'
          description: ''
    post:
      operationId: productores_create
      description: Productores registrados. Lectura pública; alta/edición solo personal
        administrativo.
      tags:
      - productores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductorRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productor'
          description: ''
  /api/productores/{slug}/:
    get:
      operationId: productores_retrieve
      description: Productores registrados. Lectura pública; alta/edición solo personal
        administrativo.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productores
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productor'
          description: ''
    put:
      operationId: productores_update
      description: Productores registrados. Lectura pública; alta/edición solo personal
        administrativo.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductorRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productor'
          description: ''
    patch:
      operationId: productores_partial_update
      description: Productores registrados. Lectura pública; alta/edición solo personal
        administrativo.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductorRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productor'
          description: ''
    delete:
      operationId: productores_destroy
      description: Productores registrados. Lectura pública; alta/edición solo personal
        administrativo.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productores
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/productos/:
    get:
      operationId: productos_list
      description: Catálogo de productos con calificación promedio calculada en base
        de datos.
      parameters:
      - in: query
        name: calificacion_min
        schema:
          type: number
      - in: query
        name: categoria
        schema:
          type: string
        description: Slug exacto de la categoría.
      - in: query
        name: categoria_arbol
        schema:
          type: string
        description: 'Slug de una categoría: incluye todas sus subcategorías.'
      - in: query
        name: cosechado_desde
        schema:
          type: string
          format: date
      - in: query
        name: en_stock
        schema:
          type: boolean
        description: true = activos con stock > 0.
      - in: query
        name: es_organico
        schema:
          type: boolean
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - activo
          - agotado
          - borrador
          - descontinuado
        description: |-
          * `borrador` - Borrador
          * `activo` - Activo
          * `agotado` - Agotado
          * `descontinuado` - Descontinuado
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: precio_max
        schema:
          type: number
      - in: query
        name: precio_min
        schema:
          type: number
      - in: query
        name: productor
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: string
          enum:
          - ayacucho
          - huancavelica
          - junin
          - pasco
        description: |-
          * `junin` - Junín
          * `huancavelica` - Huancavelica
          * `pasco` - Pasco
          * `ayacucho` - Ayacucho
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: unidad
        schema:
          type: string
          enum:
          - kg
          - lt
          - saco
          - und
        description: |-
          * `kg` - Kilogramo
          * `und` - Unidad
          * `lt` - Litro
          * `saco` - Saco de 50 kg
      tags:
      - productos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductoList'
          description: ''
    post:
      operationId: productos_create
      description: Catálogo de productos con calificación promedio calculada en base
        de datos.
      tags:
      - productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
          description: ''
  /api/productos/{slug}/:
    get:
      operationId: productos_retrieve
      description: Catálogo de productos con calificación promedio calculada en base
        de datos.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
          description: ''
    put:
      operationId: productos_update
      description: Catálogo de productos con calificación promedio calculada en base
        de datos.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
          description: ''
    patch:
      operationId: productos_partial_update
      description: Catálogo de productos con calificación promedio calculada en base
        de datos.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductoRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
          description: ''
    delete:
      operationId: productos_destroy
      description: Catálogo de productos con calificación promedio calculada en base
        de datos.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productos
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/productos/{slug}/reponer-stock/:
    post:
      operationId: productos_reponer_stock_create
      description: Suma unidades al stock; si estaba agotado vuelve a 'activo'.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReponerStockRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReponerStockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReponerStockRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
          description: ''
  /api/productos/{slug}/resenas/:
    get:
      operationId: productos_resenas_list
      description: GET lista las reseñas del producto; POST crea una (solo si recibiste
        el producto).
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: El índice inicial a partir del cual devolver los resultados.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResenaList'
          description: ''
    post:
      operationId: productos_resenas_create
      description: GET lista las reseñas del producto; POST crea una (solo si recibiste
        el producto).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          pattern: ^[-\w]+$
        required: true
      tags:
      - productos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResenaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResenaRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resena'
          description: ''
  /api/productos/destacados/:
    get:
      operationId: productos_destacados_list
      description: Top 5 activos con al menos 2 reseñas, ordenados por calificación.
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
